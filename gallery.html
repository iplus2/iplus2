<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>图片画廊</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- 顶部导航 -->
  <header class="site-header">
    <div class="header-inner">
      <h1 class="header-logo">iplus2的空间</h1>
      <div class="header-actions">
        <!-- 未登录状态 -->
        <div id="header-auth-area" class="header-auth-area" style="display:none;">
          <button class="btn btn-primary btn-sm" onclick="window.location.href='login.html'">登录 / 注册</button>
        </div>
        <!-- 已登录状态 -->
        <div id="header-user-dropdown" class="header-user-dropdown">
          <div class="user-trigger">
            <span id="header-user-name" class="header-user-name">用户名</span>
            <span class="dropdown-arrow">▼</span>
          </div>
          <div id="dropdown-menu" class="dropdown-menu">
            <div id="dropdown-user-name" class="dropdown-user-name">用户名</div>
            <button id="btn-rename" class="dropdown-item">修改用户名</button>
            <button id="btn-change-pwd" class="dropdown-item">修改密码</button>
            <button id="btn-logout" class="dropdown-item dropdown-item-danger">退出登录</button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- 画廊内容 -->
  <main class="gallery-container">
    <!-- 上传区域 -->
    <div class="upload-section">
      <h2>上传图片</h2>
      <div id="upload-msg" class="message" style="display:none;"></div>
      <div id="upload-area">
        <div class="upload-icon">📁</div>
        <p>点击或拖拽图片到此处上传</p>
      </div>
      <input type="file" id="file-input" accept="image/*" />
    </div>

    <!-- 图片列表 -->
    <div class="gallery-grid">
      <h2>所有图片</h2>
      <div id="gallery">
        <p class="loading">加载中...</p>
      </div>
      <p class="auth-link" style="margin-top:30px;">
        <a href="index.html">← 返回主页</a>
      </p>
    </div>
  </main>

  <script src="js/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/gallery.js"></script>
  <script src="js/header-auth.js"></script>
</body>
</html>
