<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>复平面</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- 顶部导航 -->
  <header class="site-header">
    <div class="header-inner">
      <h1 class="header-logo">iplus2的空间</h1>
      <div class="header-actions">
        <!-- 未登录状态 -->
        <div id="header-auth-area" class="header-auth-area" style="display:none;">
          <button class="btn btn-primary btn-sm" onclick="window.location.href='login.html'">登录 / 注册</button>
        </div>
        <!-- 已登录状态 -->
        <div id="header-user-dropdown" class="header-user-dropdown">
          <div class="user-trigger">
            <span id="header-user-name" class="header-user-name">用户名</span>
            <span class="dropdown-arrow">▼</span>
          </div>
          <div id="dropdown-menu" class="dropdown-menu">
            <div id="dropdown-user-name" class="dropdown-user-name">用户名</div>
            <button id="btn-user-center" class="dropdown-item">用户中心</button>
            <button id="btn-logout" class="dropdown-item dropdown-item-danger">退出登录</button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- 复平面内容 -->
  <main class="gallery-container">
    <!-- 发布区 -->
    <div class="post-compose" id="post-compose" style="display:none;">
      <h2>📮 发布到复平面</h2>
      <div id="compose-msg" class="message" style="display:none;"></div>
      <textarea id="post-content" placeholder="说点什么..." maxlength="2000"></textarea>
      <div class="attach-area" id="attach-area">
        <div class="attach-preview" id="attach-preview" style="display:none;">
          <span id="attach-name"></span>
          <button type="button" id="attach-remove">✕</button>
        </div>
        <div class="attach-placeholder" id="attach-placeholder">
          <span>📎</span>
          <span>添加附件（图片/音频/文件，≤10MB）</span>
        </div>
        <input type="file" id="file-input" />
      </div>
      <button id="btn-post" class="btn btn-primary">发布</button>
    </div>
    <div class="post-compose-tip" id="post-compose-tip">
      <p>🔒 <a href="login.html">登录</a> 后可以在复平面发布内容</p>
    </div>

    <!-- 帖子列表 -->
    <div class="gallery-grid">
      <h2>🌌 复平面</h2>
      <div id="post-list">
        <p class="loading">加载中...</p>
      </div>
      <p class="auth-link" style="margin-top:30px;">
        <a href="index.html">← 返回主页</a>
      </p>
    </div>
  </main>

  <script src="js/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/gallery.js"></script>
  <script src="js/header-auth.js"></script>
</body>
</html>
