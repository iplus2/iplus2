<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="site-header"></div>

  <div class="page-center">
    <div class="auth-container">
      <div class="auth-card">
        <h1>🌐 欢迎回来</h1>
        <p class="subtitle">登录你的账号</p>

        <div id="login-msg" class="message" style="display:none;"></div>

        <form id="login-form">
          <div class="form-group">
            <label for="email">邮箱</label>
            <input type="email" id="email" placeholder="your@email.com" required />
          </div>
          <div class="form-group">
            <label for="password">密码</label>
            <input type="password" id="password" placeholder="至少6位" required />
          </div>
          <div class="form-group form-check">
            <input type="checkbox" id="remember-me" />
            <label for="remember-me">30天内免登录</label>
          </div>
          <button type="submit" class="btn btn-primary">登 录</button>
        </form>

        <p class="auth-link">
          还没有账号？<a href="register.html">立即注册</a>
        </p>
        <p class="auth-link" style="margin-top:8px;">
          <a href="index.html">← 返回主页</a>
        </p>
      </div>
    </div>
  </div>

  <script src="js/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/header-auth.js"></script>
  <script src="js/vip.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
