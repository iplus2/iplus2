<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>个人空间</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/contact.css" />
</head>
<body>
  <div id="site-header"></div>

  <div class="page-center">
    <div class="private-space-wrap">
      <div class="private-header">
        <h1>💎 个人空间</h1>
        <p id="space-status">正在加载...</p>
      </div>

      <div id="private-compose" class="private-compose" style="display:none;">
        <h3>📝 发送消息</h3>
        <textarea id="compose-content" placeholder="在这里写下你想告诉我的内容..." maxlength="2000"></textarea>
        <div class="private-compose-actions">
          <label id="file-attach-label">
            📎 附件
            <input type="file" id="compose-file" accept="image/*,.pdf,.doc,.docx,.txt,.zip" />
          </label>
          <button id="btn-compose-submit" class="btn-compose">发 送</button>
        </div>
        <div id="compose-file-name" style="font-size:0.8rem;color:#888;margin-top:6px;display:none;"></div>
        <div id="compose-msg" class="message" style="margin-top:8px;"></div>
      </div>

      <div id="private-feed" class="private-feed"></div>
    </div>
  </div>

  <script src="js/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/header-auth.js"></script>
  <script src="js/vip.js"></script>
  <script src="js/contact.js"></script>
</body>
</html>
