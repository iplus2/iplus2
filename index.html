<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- 顶部导航 -->
  <header class="site-header">
    <div class="header-inner">
      <h1 class="header-logo">🌐 图片画廊</h1>
      <div class="header-actions">
        <div id="header-auth-area" class="header-auth-area" style="display:none;">
          <button class="btn btn-primary btn-sm" onclick="window.location.href='index.html'">登录 / 注册</button>
        </div>
        <div id="header-user-dropdown" class="header-user-dropdown">
          <div class="user-trigger">
            <span id="header-user-name" class="header-user-name">用户名</span>
            <span class="dropdown-arrow">▼</span>
          </div>
          <div id="dropdown-menu" class="dropdown-menu">
            <div id="dropdown-user-name" class="dropdown-user-name">用户名</div>
            <button id="btn-rename" class="dropdown-item">修改用户名</button>
            <button id="btn-change-pwd" class="dropdown-item">修改密码</button>
            <button id="btn-logout" class="dropdown-item dropdown-item-danger">退出登录</button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <div class="auth-container">
    <div class="auth-card">
      <h1>🌐 欢迎回来</h1>
      <p class="subtitle">登录你的账号</p>

      <div id="login-msg" class="message" style="display:none;"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="email">邮箱</label>
          <input type="email" id="email" placeholder="your@email.com" required />
        </div>
        <div class="form-group">
          <label for="password">密码</label>
          <input type="password" id="password" placeholder="至少6位" required />
        </div>
        <div class="form-group form-check">
          <input type="checkbox" id="remember-me" />
          <label for="remember-me">30天内免登录</label>
        </div>
        <button type="submit" class="btn btn-primary">登 录</button>
      </form>

      <p class="auth-link">
        还没有账号？<a href="register.html">立即注册</a>
      </p>
      <p class="auth-link" style="margin-top:8px;">
        <a href="home.html">← 返回主页</a>
      </p>
    </div>
  </div>

  <script src="js/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/header-auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
