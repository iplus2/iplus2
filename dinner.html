<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>晚饭吃什么</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- 顶部导航 -->
  <header class="site-header">
    <div class="header-inner">
      <h1 class="header-logo">iplus2的空间</h1>
      <div class="header-actions">
        <!-- 未登录状态 -->
        <div id="header-auth-area" class="header-auth-area">
          <button id="header-auth-btn" class="btn btn-primary btn-sm" onclick="window.location.href='login.html'">
            登录 / 注册
          </button>
        </div>
        <!-- 已登录状态 -->
        <div id="header-user-dropdown" class="header-user-dropdown" style="display:none;">
          <div class="user-trigger">
            <span id="header-user-name" class="header-user-name">用户名</span>
            <span class="dropdown-arrow">▼</span>
          </div>
          <div id="dropdown-menu" class="dropdown-menu">
            <div id="dropdown-user-name" class="dropdown-user-name">用户名</div>
            <button id="btn-user-center" class="dropdown-item">用户中心</button>
            <button id="btn-logout" class="dropdown-item dropdown-item-danger">退出登录</button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- 随机选晚餐页面 -->
  <main class="page-center">
    <div class="auth-container" style="max-width: 500px;">
      <div class="auth-card">
        <h1>🍽️ 晚饭吃什么？</h1>
        <p class="subtitle">纠结党的救星来了！</p>

        <!-- 抽取结果 -->
        <div id="result-box" class="message" style="display: none; font-size: 1.5em; padding: 30px; margin: 20px 0;">
        </div>

        <button id="btn-spin" class="btn btn-primary" style="font-size: 1.2em; padding: 15px 40px;">
          🎲 帮我选！
        </button>

        <p class="auth-link" style="margin-top: 30px;">
          <a href="index.html">← 返回主页</a>
        </p>
      </div>
    </div>
  </main>

  <script src="js/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/header-auth.js"></script>
  <script>
    // 食物选项列表
    const foods = [
      '火锅', '烧烤', '串串', '麻辣烫', '冒菜',
      '炒饭', '盖浇饭', '面条', '水饺', '馄饨',
      '炸鸡', '汉堡', '披萨', '日料', '韩式烤肉',
      '沙拉', '三明治', '粥', '包子', '煎饼',
      '酸辣粉', '螺蛳粉', '兰州拉面', '牛肉汤',
      '小龙虾', '螃蟹', '烤鱼', '粤菜', '川菜'
    ];

    const btnSpin = document.getElementById('btn-spin');
    const resultBox = document.getElementById('result-box');

    // 简单的滚动效果
    let spinning = false;

    btnSpin.addEventListener('click', () => {
      if (spinning) return;
      spinning = true;
      resultBox.style.display = 'block';
      resultBox.style.color = '#666';
      resultBox.textContent = '🤔 思考中...';

      let count = 0;
      const maxCount = 15 + Math.floor(Math.random() * 10);
      
      const interval = setInterval(() => {
        // 随机显示一个食物营造转盘效果
        const randomFood = foods[Math.floor(Math.random() * foods.length)];
        resultBox.textContent = randomFood;
        count++;

        if (count >= maxCount) {
          clearInterval(interval);
          // 最终选择一个
          const finalChoice = foods[Math.floor(Math.random() * foods.length)];
          resultBox.textContent = finalChoice;
          resultBox.style.color = '';
          resultBox.className = 'message';
          resultBox.style.background = 'var(--success-bg, #d4edda)';
          resultBox.style.color = 'var(--success, #155724)';
          spinning = false;
          btnSpin.textContent = '🎲 再选一次！';
        }
      }, 80);
    });
  </script>
</body>
</html>
