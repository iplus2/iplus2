<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>邀请码管理</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/admin-invite.css" />
</head>
<body>
  <div id="site-header"></div>

  <div class="page-center">
    <div class="admin-wrap">
      <a href="index.html" class="back-link">← 返回首页</a>

      <div class="admin-header">
        <h1>🎫 邀请码管理</h1>
        <p>生成和管理 VIP / SVIP 邀请码</p>
      </div>

      <div class="notice">
        ⚠️ <strong>仅管理员可用。</strong> 生成邀请码后请妥善保管，将码发给需要升级的用户，他们在自己的「用户中心」页面输入即可激活会员。
      </div>

      <!-- 生成区 -->
      <div class="admin-card">
        <h3>➕ 生成新邀请码</h3>
        <div class="gen-form">
          <select id="code-type-select">
            <option value="vip">VIP</option>
            <option value="svip">SVIP</option>
          </select>
          <input type="text" id="custom-code-input" placeholder="留空则自动生成" maxlength="24" style="padding:8px 12px;border:1px solid #d1d5db;border-radius:8px;font-size:0.9rem;outline:none;" />
          <button id="btn-gen-code" class="btn btn-primary">生成</button>
        </div>
        <div id="gen-result" class="result-box result-empty" style="display:none;"></div>
      </div>

      <!-- 列表区 -->
      <div class="admin-card">
        <h3>📋 邀请码列表</h3>
        <div id="codes-loading" class="loading">加载中...</div>
        <div id="codes-list"></div>
      </div>
    </div>
  </div>

  <script src="js/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/header-auth.js"></script>
  <script src="js/admin-invite.js"></script>
</body>
</html>
