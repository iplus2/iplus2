<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>邀请码管理</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    body { background: #f5f6fa; font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .admin-wrap { max-width: 720px; margin: 0 auto; padding: 0 16px 60px; }
    .admin-header { text-align: center; padding: 32px 0 24px; }
    .admin-header h1 { font-size: 1.5rem; color: #333; }
    .admin-header p { font-size: 0.85rem; color: #888; margin-top: 6px; }

    .admin-card {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }

    .admin-card h3 {
      font-size: 0.95rem;
      color: #555;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .code-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid #f0f0f0;
      font-size: 0.9rem;
    }
    .code-row:last-child { border-bottom: none; }

    .code-str { font-family: monospace; font-size: 1rem; font-weight: bold; color: #333; letter-spacing: 2px; }
    .code-type { font-size: 0.75rem; padding: 2px 8px; border-radius: 10px; }
    .code-type-vip { background: #dbeafe; color: #2563eb; }
    .code-type-svip { background: #ede9fe; color: #7c3aed; }
    .code-status { font-size: 0.78rem; color: #aaa; flex: 1; text-align: right; }

    .gen-form { display: flex; gap: 10px; align-items: center; }
    .gen-form select {
      padding: 8px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
      cursor: pointer;
    }
    .gen-form select:focus { border-color: var(--color-primary, #3b82f6); }

    .result-box {
      margin-top: 12px;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      word-break: break-all;
    }
    .result-success { background: #f0fdf4; border: 1px solid #bbf7d0; color: #166534; }
    .result-error { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; }
    .result-empty { background: #f9fafb; border: 1px solid #e5e7eb; color: #6b7280; text-align: center; }

    .btn-copy {
      padding: 4px 10px;
      font-size: 0.78rem;
      background: #f3f4f6;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-copy:hover { background: #e5e7eb; }
    .btn-copy.copied { background: #d1fae5; border-color: #6ee7b7; color: #065f46; }

    .notice { background: #fffbeb; border: 1px solid #fde68a; border-radius: 10px; padding: 14px 18px; font-size: 0.88rem; color: #92400e; margin-bottom: 20px; }

    .loading { text-align: center; padding: 24px; color: #aaa; }
    .back-link { display: inline-block; margin-bottom: 16px; color: #888; font-size: 0.85rem; text-decoration: none; }
    .back-link:hover { color: #333; }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <h1 class="header-logo">iplus2的空间</h1>
      <div class="header-actions">
        <div id="header-auth-area" class="header-auth-area" style="display:none;">
          <button class="btn btn-primary btn-sm" onclick="window.location.href='login.html'">登录</button>
        </div>
        <div id="header-user-dropdown" class="header-user-dropdown" style="display:none;">
          <div class="user-trigger">
            <span id="header-user-name" class="header-user-name">用户名</span>
            <span class="dropdown-arrow">▼</span>
          </div>
          <div id="dropdown-menu" class="dropdown-menu">
            <div id="dropdown-user-name" class="dropdown-user-name">用户名</div>
            <button id="btn-user-center" class="dropdown-item">用户中心</button>
            <button id="btn-logout" class="dropdown-item dropdown-item-danger">退出登录</button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <div class="page-center">
    <div class="admin-wrap">
      <a href="index.html" class="back-link">← 返回首页</a>

      <div class="admin-header">
        <h1>🎫 邀请码管理</h1>
        <p>生成和管理 VIP / SVIP 邀请码</p>
      </div>

      <div class="notice">
        ⚠️ <strong>仅管理员可用。</strong> 生成邀请码后请妥善保管，将码发给需要升级的用户，他们在自己的「用户中心」页面输入即可激活会员。
      </div>

      <!-- 生成区 -->
      <div class="admin-card">
        <h3>➕ 生成新邀请码</h3>
        <div class="gen-form">
          <select id="code-type-select">
            <option value="vip">VIP</option>
            <option value="svip">SVIP</option>
          </select>
          <input type="text" id="custom-code-input" placeholder="留空则自动生成" maxlength="24" style="padding:8px 12px;border:1px solid #d1d5db;border-radius:8px;font-size:0.9rem;outline:none;" />
          <button id="btn-gen-code" class="btn btn-primary">生成</button>
        </div>
        <div id="gen-result" class="result-box result-empty" style="display:none;"></div>
      </div>

      <!-- 列表区 -->
      <div class="admin-card">
        <h3>📋 邀请码列表</h3>
        <div id="codes-loading" class="loading">加载中...</div>
        <div id="codes-list"></div>
      </div>
    </div>
  </div>

  <script src="js/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/header-auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // 权限检查
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) { window.location.href = 'login.html'; return; }

      const { data: profile } = await supabase
        .from('profiles').select('is_admin').eq('id', session.user.id).single();

      if (!profile?.is_admin) {
        document.querySelector('.admin-wrap').innerHTML =
          '<div class="notice" style="margin-top:20px;">⚠️ 你没有管理员权限，<a href="index.html">返回首页</a></div>';
        return;
      }

      loadCodes();

      // 生成
      document.getElementById('btn-gen-code').addEventListener('click', async () => {
        const type = document.getElementById('code-type-select').value;
        const customCode = document.getElementById('custom-code-input').value;
        const btn = document.getElementById('btn-gen-code');
        const result = document.getElementById('gen-result');
        btn.disabled = true;
        btn.textContent = '生成中...';
        result.style.display = 'none';

        try {
          const { data, error } = await supabase.rpc('create_invite_code', {
            p_type: type,
            p_custom_code: customCode || null
          });
          if (error) throw error;
          result.className = 'result-box result-success';
          result.innerHTML = `✅ 邀请码生成成功：<strong>${data}</strong>（${type.toUpperCase()}）
            <button class="btn-copy" onclick="copyCode(this, '${data}')">复制</button>`;
          document.getElementById('custom-code-input').value = '';
          result.style.display = 'block';
          loadCodes();
        } catch (e) {
          result.className = 'result-box result-error';
          result.textContent = '❌ 生成失败：' + e.message;
          result.style.display = 'block';
        } finally {
          btn.disabled = false;
          btn.textContent = '生成';
        }
      });
    });

    async function loadCodes() {
      const list = document.getElementById('codes-list');
      const loading = document.getElementById('codes-loading');
      loading.style.display = 'block';
      list.innerHTML = '';

      const { data: codes, error } = await supabase
        .from('invite_codes')
        .select('*')
        .order('created_at', { ascending: false })
        .limit(50);

      loading.style.display = 'none';

      if (error) {
        list.innerHTML = `<div style="text-align:center;padding:20px;color:#e11d48;">加载失败：${error.message}</div>`;
        return;
      }
      if (!codes || codes.length === 0) {
        list.innerHTML = '<div style="text-align:center;padding:20px;color:#aaa;">暂无邀请码</div>';
        return;
      }

      list.innerHTML = codes.map(c => `
        <div class="code-row">
          <span class="code-str">${c.code}</span>
          <span class="code-type code-type-${c.type}">${c.type.toUpperCase()}</span>
          <span class="code-status">${c.used ? '✅ 已使用' : '⏳ 未使用'}</span>
          ${!c.used ? `<button class="btn-copy" onclick="copyCode(this, '${c.code}')">复制</button>` : ''}
        </div>
      `).join('');
    }

    function copyCode(btn, code) {
      navigator.clipboard.writeText(code).then(() => {
        btn.textContent = '已复制!';
        btn.classList.add('copied');
        setTimeout(() => { btn.textContent = '复制'; btn.classList.remove('copied'); }, 1500);
      });
    }
  </script>
</body>
</html>
