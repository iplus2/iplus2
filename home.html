<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>图片画廊</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- 顶部导航 -->
  <header class="site-header">
    <div class="header-inner">
      <h1 class="header-logo">🌐 图片画廊</h1>
      <div class="header-actions">
        <!-- 未登录状态 -->
        <div id="header-auth-area" class="header-auth-area">
          <button id="header-auth-btn" class="btn btn-primary btn-sm" onclick="window.location.href='index.html'">
            登录 / 注册
          </button>
        </div>
        <!-- 已登录状态 -->
        <div id="header-user-dropdown" class="header-user-dropdown" style="display:none;">
          <div class="user-trigger">
            <span id="header-user-name" class="header-user-name">用户名</span>
            <span class="dropdown-arrow">▼</span>
          </div>
          <div id="dropdown-menu" class="dropdown-menu">
            <div id="dropdown-user-name" class="dropdown-user-name">用户名</div>
            <button id="btn-rename" class="dropdown-item">修改用户名</button>
            <button id="btn-change-pwd" class="dropdown-item">修改密码</button>
            <button id="btn-logout" class="dropdown-item dropdown-item-danger">退出登录</button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- 主页内容 -->
  <main class="home-container">
    <section class="home-hero">
      <h2 id="home-welcome">欢迎来到图片画廊</h2>
      <p id="home-description">登录后可以上传和管理你的图片。</p>
      <a href="gallery.html" class="btn btn-primary home-cta">进入画廊 →</a>
    </section>
  </main>

  <script src="js/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
