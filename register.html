<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>注册</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <h1>🌐 创建账号</h1>
      <p class="subtitle">注册一个新账号</p>

      <div id="register-msg" class="message" style="display:none;"></div>

      <form id="register-form">
        <div class="form-group">
          <label for="email">邮箱</label>
          <input type="email" id="email" placeholder="your@email.com" required />
        </div>
        <div class="form-group">
          <label for="username">用户名</label>
          <input type="text" id="username" placeholder="你的昵称" required />
        </div>
        <div class="form-group">
          <label for="password">密码</label>
          <input type="password" id="password" placeholder="至少6位" required />
        </div>
        <div class="form-group">
          <label for="confirm-password">确认密码</label>
          <input type="password" id="confirm-password" placeholder="再次输入密码" required />
        </div>
        <button type="submit" class="btn btn-primary">注 册</button>
      </form>

      <p class="auth-link">
        已有账号？<a href="index.html">去登录</a>
      </p>
    </div>
  </div>

  <script src="js/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
