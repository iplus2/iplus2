<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>心愿单</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/wishlist.css" />
</head>
<body>
  <div id="site-header"></div>
  <main class="wishlist-wrap">
    <header class="wishlist-heading">
      <h1>✨ 心愿单</h1>
      <p>写下自己的心愿（多小的都行）。</p>
    </header>
    <p id="wishlist-status" role="status">正在打开心愿单...</p>
    <div id="wishlist-content" hidden>
      <form id="wishlist-compose" class="wishlist-card">
        <h2>添加心愿</h2>
        <fieldset id="wishlist-fields">
          <div id="wishlist-owner-wrap" hidden>
            <label for="wishlist-owner">与谁共享</label>
            <select id="wishlist-owner"></select>
          </div>
          <label for="wishlist-text">心愿内容</label>
          <textarea id="wishlist-text" maxlength="2000" required placeholder="写下你的心愿..."></textarea>
          <label for="wishlist-file">附上一张图片（可选）</label>
          <input id="wishlist-file" type="file" accept="image/jpeg,image/png,image/webp,image/gif" />
          <p class="wishlist-hint">最多一张，支持 JPG、PNG、WebP、GIF，最大 10 MB。</p>
          <img id="wishlist-preview" class="wishlist-photo" alt="所选图片预览" hidden />
          <button id="wishlist-remove-photo" class="btn btn-secondary" type="button" hidden>移除图片</button>
        </fieldset>
        <button id="wishlist-send" class="btn btn-primary" type="submit">添加心愿</button>
        <p id="wishlist-send-status" role="status"></p>
      </form>
      <div class="wishlist-toolbar">
        <p>默认显示全部未完成心愿，加载更多可查看已完成心愿。</p>
        <button id="wishlist-refresh" class="btn btn-secondary" type="button">刷新</button>
      </div>
      <p id="wishlist-list-status" role="status"></p>
      <div id="wishlist-feed" class="wishlist-feed"></div>
      <button id="wishlist-more" class="btn btn-secondary" type="button" hidden>加载更多（已完成心愿）</button>
    </div>
  </main>
  <script src="js/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/header-auth.js"></script>
  <script src="js/vip.js"></script>
  <script src="js/wishlist.js"></script>
</body>
</html>
